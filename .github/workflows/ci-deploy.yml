# On every push to the Phase 2 branch: lint, typecheck and run all tests; if they pass, deploy the worker to the
# DigitalOcean droplet (through the Vultr registry), then ask Render to deploy the API. Pull requests only run
# the tests.
#
# The worker goes first: a new API can queue work only a new worker knows (e.g. joining several files), while a
# new worker handles everything an old API queues.
#
# Two Node versions on purpose: the server (API, worker, pipeline) runs on Render with Node 20, so it is tested
# on Node 20; the website's test tooling (jsdom 30) needs Node 22.22 or newer, so the website is tested on 24.
#
# One-time set-up (GitHub: repository, Settings, Secrets and variables, Actions, New repository secret):
#   RENDER_API_KEY      the Render API key of the workspace that holds meetingid-phase2 (the API)
#   VULTR_CR_USERNAME   the Vultr Container Registry user (qlink01's "Username")
#   VULTR_CR_PASSWORD   the Vultr Container Registry API key (qlink01's "API Key")
#   DROPLET_SSH_KEY     the private half of the CI deploy key; on the droplet it can only run
#                       /opt/meetingid/deploy-worker.sh (see deploy/worker/README.md)
# The service ids below are not secret. Vercel needs nothing here: it deploys the website on every push.
name: CI and deploy

on:
  push:
    branches: [phase-2-speaker-identity]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  # a newer push replaces a pull request's run, but never stops a deploy half-way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (pipeline and API)
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test -w @meetingid/pipeline -w @meetingid/api 2>&1 | tee test.log || status=$?
          if [ "$status" != "0" ]; then
            # put the failing lines in the run's annotations, where they are readable without logging in
            summary=$(sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' test.log | grep -E 'FAIL|AssertionError|Error|×|npm error|Test Files|Tests |Cannot find|ENOENT|EACCES' | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Server tests failed::${summary}"
          fi
          exit $status

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Test (website)
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test -w @meetingid/web 2>&1 | tee test.log || status=$?
          if [ "$status" != "0" ]; then
            summary=$(sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' test.log | grep -E 'FAIL|AssertionError|Error|×|npm error|Test Files|Tests |Cannot find|ENOENT|EACCES' | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Website tests failed::${summary}"
          fi
          exit $status

  deploy:
    needs: [test-server, test-web, deploy-worker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/phase-2-speaker-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Deploy the API
        run: |
          deploy() {
            local name="$1" service="$2" key="$3"
            if [ -z "$key" ]; then echo "::error::the secret for $name is not set"; return 1; fi
            local code
            code=$(curl -s -o /tmp/render.out -w '%{http_code}' -X POST \
              "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $key" -H 'Content-Type: application/json' \
              -d '{"clearCache":"do_not_clear"}')
            echo "$name: HTTP $code"
            if [ "$code" != "201" ]; then cat /tmp/render.out; echo; return 1; fi
          }
          failed=0
          deploy "API (meetingid-phase2)" srv-db4963vlot8c7388nku0 "$RENDER_API_KEY" || failed=1
          # The worker moved to a DigitalOcean droplet on 20 Oct (Dockerfile.worker); the Render worker is
          # suspended and is no longer deployed from here.
          exit $failed

  # The worker runs on the DigitalOcean droplet: build its image here, push it to the Vultr registry, and ask the
  # droplet to switch to it. The droplet waits until no meeting is processing, and rolls back if the new worker
  # is not healthy (deploy/worker/deploy-worker.sh).
  deploy-worker:
    needs: [test-server, test-web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/phase-2-speaker-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE: blr.vultrcr.com/qlink01/meetingid-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: blr.vultrcr.com
          username: ${{ secrets.VULTR_CR_USERNAME }}
          password: ${{ secrets.VULTR_CR_PASSWORD }}
      - name: Build and push the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Switch the droplet to the new image
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          CR_USER: ${{ secrets.VULTR_CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.VULTR_CR_PASSWORD }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # the droplet's host key, pinned (not fetched at deploy time)
          echo '139.59.39.155 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPUspV1Q+vp+lxbnsli2cRuhuBJo1GOct4VDCU3CUq5V' > ~/.ssh/known_hosts
          # the registry password goes on stdin, never on a command line
          printf '%s\n' "$CR_PASSWORD" | ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            root@139.59.39.155 "deploy ${{ github.sha }} $CR_USER"
